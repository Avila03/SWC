<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2416">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:site_name" content="Swamp Chill">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="https://swampchill.vercel.app/assets/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/gallery.css">
  <link rel="stylesheet" href="/pages.css">
  <title>Peça — Swamp Chill</title>
  <meta name="description" content="Peça da Swamp Chill: streetwear premium, feita sob demanda.">
  <meta property="og:title" content="Swamp Chill">
  <script defer src="/swc-core.js"></script>
  <script defer src="/produto.js"></script>
</head>
<body class="p-page">
  <a class="skip-link" href="#conteudo">Ir para conteúdo</a>
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header g-header" id="topo">
    <a class="g-brand" href="/" aria-label="Swamp Chill, início">
      <img src="/assets/swamp-chill-lettering.webp" alt="Swamp Chill" width="320" height="186">
    </a>
    <nav class="g-nav" id="g-nav" aria-label="Navegação principal">
      <a href="/#colecao">Coleções</a><a href="/#manifesto">Essência</a><a href="/#contato">Próximo drop</a>
    </nav>
    <div class="g-actions">
      <span class="g-est">EST 2026</span>
      <a class="bag-trigger" href="/checkout.html" aria-label="Sacola e checkout">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8h15l-1.2 12H5.7L4.5 8Zm4-1V6a3.5 3.5 0 0 1 7 0v1"/></svg>
        <span>Sacola</span><span class="bag-count" data-bag-count>0</span>
      </a>
      <button class="g-menu" type="button" aria-controls="g-nav" aria-expanded="false" aria-label="Abrir menu"><i></i><i></i></button>
    </div>
  </header>

  <main id="conteudo" class="p-main">
    <nav class="p-crumbs" aria-label="Você está em">
      <a href="/#colecao">Coleções</a><span aria-hidden="true">/</span><a id="crumb-collection" href="/#colecao">—</a><span aria-hidden="true">/</span><span id="crumb-name" aria-current="page">—</span>
    </nav>

    <section class="p-product" id="produto" aria-live="polite">
      <p class="p-loading">Carregando peça…</p>
    </section>

    <section class="p-more" id="mais" hidden>
      <p class="g-kicker">DA MESMA COLEÇÃO</p>
      <div class="p-more-grid" id="mais-grid"></div>
    </section>
  </main>

  <footer class="g-footer">
    <img src="/assets/swamp-chill-lettering.webp" alt="Swamp Chill" width="320" height="186" loading="lazy">
    <span>QUALIDADE RAIZ. EXCLUSIVIDADE REAL.</span>
    <span>© 2026 SWC · EST 2026</span>
  </footer>

  <div class="p-added" id="p-added" role="dialog" aria-modal="false" aria-labelledby="p-added-title" hidden>
    <img id="p-added-img" alt="">
    <div>
      <p class="g-kicker" id="p-added-title">NA SACOLA</p>
      <strong id="p-added-name"></strong>
      <span id="p-added-variant"></span>
    </div>
    <div class="p-added-actions">
      <button type="button" class="p-btn p-btn-ghost" id="p-added-close">Continuar</button>
      <a class="p-btn" href="/checkout.html">Finalizar compra</a>
    </div>
  </div>
</body>
</html>
